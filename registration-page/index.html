<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css" />
        <title>Центр инициатив ТПУ</title>
        <meta charset="UTF-8">
    </head>
<body >
    <div class="top-line">
        <h1>Инициативы ТПУ</h1>
    </div>
    <h2>Добро пожаловать на сайт центр инициатив НИ ТПУ</h2>
    <img class="tpu-logo" src="image/TPU-logo.jpg" alt="Логотип ТПУ">
    <section class="verification-section">
        <h3>Для продолжения нужно подтвердить свою личность</h3>
        <h4>Войдите по почте ТПУ. Мы пришлем код подтверждения</h4>
        <input class="email-input" type="email" placeholder="pochta@tpu.ru">
        <button type="submit" class="get-code-button">Получить код</button>
        <p class="error-message-email">Ошибка. Неверно введена почта или она не принадлежит ТПУ</p>
    </section>

    <section class="give-code-section">
        <h5>Введите шестизначный код подтверждения ниже</h5>
        <input class="code-input" type="text" placeholder="123456">
        <button type="submit" class="give-code-button">Подтвердить код</button>
    </section>
</body>
</html>
