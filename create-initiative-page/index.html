<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css" />
        <title>Центр инициатив ТПУ</title>
        <meta charset="UTF-8">
    </head>
<body >
    <div class="top-line">
        <h1>Инициативы ТПУ</h1>
    </div>
    <h2>Меню создания своей инициативы</h2>

        <p>Заголовок инициативы: <input class="topic" type="text"></p>
        <p>Выберете категорию инициативы: <select id="my-select" name="choice">
                                          <option value="val1">Общежитие</option>
                                          <option value="val2">Спорт</option>
                                          <option value="val3">Наука</option>
                                          <option value="val4">Творчество</option>
                                          <option value="val5">Цифровая</option>
                                          <option value="val6">Академические</option>
                                          <option value="val7">Профком</option>
                                                                    </select></p>
        <p>Текст инициативы:</p><p><textarea class="initiative-text" name="initiative-text" rows="25" cols="100"></textarea></p>
    </section>
</body>
